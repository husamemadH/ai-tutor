<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المدرّس الذكي</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2130; --user:#2563eb; --tutor:#232c3d; --muted:#8b97ab; --line:#2c3548; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;
         background:var(--bg); color:#e8edf5; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:.6rem; align-items:center; padding:.7rem 1rem; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:1.05rem; margin:0; font-weight:600; }
  select, button, input, textarea { font:inherit; color:inherit; }
  select, button { background:#111827; border:1px solid var(--line); border-radius:.5rem; padding:.45rem .7rem; }
  #book { min-width:16rem; }
  optgroup { font-weight:600; color:var(--muted); }
  button { cursor:pointer; }
  button:hover { background:#1f2937; }
  button:disabled { opacity:.5; cursor:default; }
  button.rec { background:#7f1d1d; border-color:#ef4444; }
  button.on { background:#14532d; border-color:#22c55e; }
  #log { flex:1; overflow-y:auto; padding:1.2rem; display:flex; flex-direction:column; gap:.9rem; }
  .row { display:flex; }
  .row.user { justify-content:flex-start; }
  .row.tutor { justify-content:flex-end; }
  .bubble { max-width:min(760px,88%); padding:.7rem .9rem; border-radius:1rem; line-height:1.9;
            white-space:pre-wrap; word-wrap:break-word; }
  .user .bubble { background:var(--user); border-bottom-right-radius:.25rem; }
  .tutor .bubble { background:var(--tutor); border-bottom-left-radius:.25rem; }
  .sources { margin-top:.45rem; font-size:.78rem; color:var(--muted); }
  .empty { margin:auto; color:var(--muted); text-align:center; }
  footer { display:flex; gap:.5rem; padding:.8rem 1rem; background:var(--panel); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; background:#111827; border:1px solid var(--line); border-radius:.6rem;
             padding:.6rem .7rem; max-height:8rem; }
  .cursor::after { content:"▋"; opacity:.6; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<header>
  <h1>المدرّس الذكي</h1>
  <select id="book"></select>
  <button id="new">محادثة جديدة</button>
  <button id="tts" type="button"></button>
  <select id="rate" title="سرعة قراءة الصوت"></select>
  <span id="status" style="color:var(--muted);font-size:.85rem;margin-inline-start:auto"></span>
</header>

<div id="log"><div class="empty">اختر كتابًا وابدأ السؤال…</div></div>

<footer>
  <textarea id="input" rows="1" placeholder="اكتب سؤالك… (Enter للإرسال)"></textarea>
  <button id="mic" type="button">تحدث</button>
  <button id="send">إرسال</button>
</footer>

<script>
const log = document.getElementById("log");
const bookSel = document.getElementById("book");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const newBtn = document.getElementById("new");
const ttsBtn = document.getElementById("tts");
const rateSel = document.getElementById("rate");
const statusEl = document.getElementById("status");
const MAX_MS = 30000;
const MIN_MS = 400;
const RATE_OPTIONS = [
  { value: "-50%", label: "بطيء جدًا (-50%)" },
  { value: "-25%", label: "بطيء (-25%)" },
  { value: "-15%", label: "أبطأ قليلاً (-15%)" },
  { value: "-10%", label: "أبطأ قليلاً (-10%)" },
  { value: "-5%", label: "أبطأ قليلاً (-5%)" },
  { value: "0%", label: "عادي (0%)" },
  { value: "+5%", label: "أسرع قليلاً (+5%)" },
  { value: "+10%", label: "أسرع قليلاً (+10%)" },
  { value: "+15%", label: "أسرع قليلاً (+15%)" },
  { value: "+25%", label: "سريع (+25%)" },
  { value: "+50%", label: "سريع جدًا (+50%)" },
];
let sessionId = null;
let recorder = null;
let recStream = null;
let recChunks = [];
let recTimer = null;
let recStarted = 0;
let recording = false;
let ttsOn = localStorage.getItem("tts") === "on";
let ttsRate = RATE_OPTIONS.some((o) => o.value === localStorage.getItem("ttsRate"))
  ? localStorage.getItem("ttsRate") : "0%";
let audioEl = null;

const GRADE_NAME = {
  "1": "الأول", "2": "الثاني", "3": "الثالث", "4": "الرابع",
  "5": "الخامس", "6": "السادس", "7": "السابع", "8": "الثامن",
  "9": "التاسع", "10": "العاشر", "11": "الحادي عشر", "12": "الثاني عشر",
};
const SUBJECT_NAME = {
  arabic: "اللغة العربية", العربية: "اللغة العربية",
  math: "الرياضيات", الرياضيات: "الرياضيات",
  science: "العلوم", العلوم: "العلوم",
  geo: "الجغرافيا", physics: "الفيزياء", chemistry: "الكيمياء",
  lifescience: "علوم الحياة",
};
const SUBJECT_RANK = ["arabic", "العربية", "math", "الرياضيات", "science", "العلوم", "physics", "chemistry", "lifescience", "geo"];

function semesterOf(title) {
  const m = title.match(/^[a-z]+(\d+)$/i);
  if (m) {
    const d = m[1].slice(-1);
    if (d === "1") return "الفصل الأول";
    if (d === "2") return "الفصل الثاني";
  }
  if (title.includes("الفصل الأول")) return "الفصل الأول";
  if (title.includes("الفصل الثاني")) return "الفصل الثاني";
  return "";
}

function bookLabel(b) {
  const sem = semesterOf(b.title);
  const sub = SUBJECT_NAME[b.subject];
  if (sub && sem) return `${sub} — ${sem}`;
  return b.title;
}

async function loadBooks() {
  const books = await (await fetch("/api/books")).json();
  bookSel.innerHTML = "";
  if (!books.length) {
    bookSel.innerHTML = "<option value=''>لا توجد كتب</option>";
    return;
  }
  const groups = new Map();
  for (const b of books) {
    const g = b.grade || "؟";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(b);
  }
  const grades = [...groups.keys()].sort((a, b) => (parseInt(a, 10) || 99) - (parseInt(b, 10) || 99));
  for (const g of grades) {
    const og = document.createElement("optgroup");
    og.label = GRADE_NAME[g] ? `الصف ${GRADE_NAME[g]}` : `الصف ${g}`;
    const items = groups.get(g).sort((a, b) => {
      const ra = SUBJECT_RANK.indexOf(a.subject);
      const rb = SUBJECT_RANK.indexOf(b.subject);
      const d = (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
      if (d) return d;
      return bookLabel(a).localeCompare(bookLabel(b), "ar");
    });
    for (const b of items) {
      const o = document.createElement("option");
      o.value = b.id;
      o.textContent = bookLabel(b);
      og.appendChild(o);
    }
    bookSel.appendChild(og);
  }
}

function clearLog() {
  log.innerHTML = '<div class="empty">ابدأ السؤال…</div>';
}

function bubble(role, text) {
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = `row ${role}`;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text || "";
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function updateTtsBtn() {
  ttsBtn.textContent = ttsOn ? "🔊" : "🔇";
  ttsBtn.title = ttsOn ? "إيقاف التشغيل التلقائي" : "تشغيل الردود تلقائيًا";
  ttsBtn.classList.toggle("on", ttsOn);
}

function stopAudio() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
}

const AR_DIACRITICS = /[\u064B-\u0652\u0670]/g;

function stripTashkeel(text) {
  return text.replace(AR_DIACRITICS, "");
}

async function playTts(text) {
  if (!ttsOn || !text.trim()) return;
  stopAudio();
  statusEl.textContent = "جاري تجهيز الصوت…";
  try {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, rate: ttsRate }),
    });
    if (!res.ok) {
      let detail = "تعذّر تجهيز الصوت";
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      statusEl.textContent = detail;
      return;
    }
    const url = URL.createObjectURL(await res.blob());
    audioEl = new Audio(url);
    audioEl.onended = () => { URL.revokeObjectURL(url); audioEl = null; };
    await audioEl.play();
    statusEl.textContent = "جاهز";
  } catch (e) {
    statusEl.textContent = "تعذّر تجهيز الصوت";
  }
}

async function newSession() {
  const bookId = bookSel.value || null;
  const res = await fetch("/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ book_id: bookId }),
  });
  if (!res.ok) { statusEl.textContent = "تعذّر إنشاء محادثة"; return; }
  sessionId = (await res.json()).session_id;
  clearLog();
  statusEl.textContent = "جاهز";
}

function pickMime() {
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

function stopRec() {
  if (!recording) return;
  recording = false;
  clearInterval(recTimer);
  recTimer = null;
  if (recorder && recorder.state !== "inactive") recorder.stop();
  (recStream ? recStream.getTracks() : []).forEach((t) => t.stop());
  recStream = null;
  micBtn.classList.remove("rec");
}

async function onRecStop() {
  const elapsed = Date.now() - recStarted;
  const mime = (recorder && recorder.mimeType) || "audio/webm";
  const chunks = recChunks;
  recorder = null;
  recChunks = [];
  if (elapsed < MIN_MS || !chunks.length) {
    statusEl.textContent = "جاهز";
    sendBtn.disabled = false;
    micBtn.disabled = false;
    return;
  }
  statusEl.textContent = "جاري التحويل…";
  micBtn.disabled = true;
  const blob = new Blob(chunks, { type: mime });
  const ext = mime.includes("mp4") ? "mp4" : "webm";
  const form = new FormData();
  form.append("file", blob, "clip." + ext);
  try {
    const res = await fetch("/api/stt", { method: "POST", body: form });
    if (!res.ok) {
      let detail = "تعذّر التحويل";
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      statusEl.textContent = detail;
      return;
    }
    const data = await res.json();
    const text = (data.text || "").trim();
    if (!text) {
      statusEl.textContent = "ما سمعت إشي";
      return;
    }
    statusEl.textContent = "جاهز";
    await send(text);
  } catch (e) {
    statusEl.textContent = "تعذّر التحويل";
  } finally {
    sendBtn.disabled = false;
    micBtn.disabled = false;
  }
}

async function toggleMic() {
  if (recording) { stopRec(); return; }
  if (!sessionId || sendBtn.disabled) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (_) {
    statusEl.textContent = "الميكروفون غير مسموح";
    return;
  }
  recStream = stream;
  recChunks = [];
  const mime = pickMime();
  recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = onRecStop;
  recorder.start();
  recording = true;
  recStarted = Date.now();
  micBtn.classList.add("rec");
  sendBtn.disabled = true;
  statusEl.textContent = "تسجيل… 30";
  recTimer = setInterval(() => {
    const left = Math.max(0, Math.ceil((MAX_MS - (Date.now() - recStarted)) / 1000));
    statusEl.textContent = "تسجيل… " + left;
  }, 200);
  setTimeout(() => { if (recording) stopRec(); }, MAX_MS);
}

async function send(preset) {
  const message = (typeof preset === "string" ? preset : input.value).trim();
  if (!message || !sessionId || recording) return;
  if (typeof preset !== "string") input.value = "";
  sendBtn.disabled = true;
  micBtn.disabled = true;
  stopAudio();
  bubble("user", message);
  const out = bubble("tutor", "");
  out.classList.add("cursor");
  let sourceRefs = "";
  let answer = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data:")) continue;
        const ev = JSON.parse(part.slice(5).trim());
        if (ev.delta) {
          answer += ev.delta;
          out.textContent += stripTashkeel(ev.delta);
          log.scrollTop = log.scrollHeight;
        } else if (ev.sources) {
          const pages = [...new Set(ev.sources.map(s => s.page).filter(Boolean))].sort((a, b) => a - b);
          if (pages.length) sourceRefs = "المصادر: " + pages.map(p => "ص" + p).join("، ");
        } else if (ev.error) {
          out.textContent += `\n[خطأ: ${ev.error}]`;
        }
      }
    }
  } catch (e) {
    out.textContent += `\n[خطأ: ${e.message}]`;
  } finally {
    out.classList.remove("cursor");
    if (sourceRefs) {
      const s = document.createElement("div");
      s.className = "sources";
      s.textContent = sourceRefs;
      out.appendChild(s);
    }
    sendBtn.disabled = false;
    micBtn.disabled = false;
    input.focus();
    playTts(answer);
  }
}

sendBtn.onclick = () => send();
micBtn.onclick = toggleMic;
newBtn.onclick = newSession;
ttsBtn.onclick = () => {
  ttsOn = !ttsOn;
  localStorage.setItem("tts", ttsOn ? "on" : "off");
  if (!ttsOn) stopAudio();
  updateTtsBtn();
};
bookSel.addEventListener("change", newSession);
rateSel.onchange = () => {
  ttsRate = rateSel.value;
  localStorage.setItem("ttsRate", ttsRate);
};
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

for (const o of RATE_OPTIONS) {
  const opt = document.createElement("option");
  opt.value = o.value;
  opt.textContent = o.label;
  rateSel.appendChild(opt);
}
rateSel.value = ttsRate;
updateTtsBtn();
loadBooks().then(newSession);
</script>
</body>
</html>
