<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المدرّس الذكي</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2130; --user:#2563eb; --tutor:#232c3d; --muted:#8b97ab; --line:#2c3548; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;
         background:var(--bg); color:#e8edf5; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:.6rem; align-items:center; padding:.7rem 1rem; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:1.05rem; margin:0; font-weight:600; }
  select, button, input, textarea { font:inherit; color:inherit; }
  select, button { background:#111827; border:1px solid var(--line); border-radius:.5rem; padding:.45rem .7rem; }
  button { cursor:pointer; }
  button:hover { background:#1f2937; }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:1.2rem; display:flex; flex-direction:column; gap:.9rem; }
  .row { display:flex; }
  .row.user { justify-content:flex-start; }
  .row.tutor { justify-content:flex-end; }
  .bubble { max-width:min(760px,88%); padding:.7rem .9rem; border-radius:1rem; line-height:1.9;
            white-space:pre-wrap; word-wrap:break-word; }
  .user .bubble { background:var(--user); border-bottom-right-radius:.25rem; }
  .tutor .bubble { background:var(--tutor); border-bottom-left-radius:.25rem; }
  .sources { margin-top:.45rem; font-size:.78rem; color:var(--muted); }
  .empty { margin:auto; color:var(--muted); text-align:center; }
  footer { display:flex; gap:.5rem; padding:.8rem 1rem; background:var(--panel); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; background:#111827; border:1px solid var(--line); border-radius:.6rem;
             padding:.6rem .7rem; max-height:8rem; }
  .cursor::after { content:"▋"; opacity:.6; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<header>
  <h1>المدرّس الذكي</h1>
  <select id="book"></select>
  <button id="new">محادثة جديدة</button>
  <span id="status" style="color:var(--muted);font-size:.85rem;margin-inline-start:auto"></span>
</header>

<div id="log"><div class="empty">اختر كتابًا وابدأ السؤال…</div></div>

<footer>
  <textarea id="input" rows="1" placeholder="اكتب سؤالك… (Enter للإرسال)"></textarea>
  <button id="send">إرسال</button>
</footer>

<script>
const log = document.getElementById("log");
const bookSel = document.getElementById("book");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newBtn = document.getElementById("new");
const statusEl = document.getElementById("status");
let sessionId = null;

async function loadBooks() {
  const books = await (await fetch("/api/books")).json();
  bookSel.innerHTML = "";
  if (!books.length) {
    bookSel.innerHTML = "<option value=''>لا توجد كتب</option>";
    return;
  }
  for (const b of books) {
    const o = document.createElement("option");
    o.value = b.id;
    o.textContent = `${b.title} (صف ${b.grade})`;
    bookSel.appendChild(o);
  }
}

function clearLog() {
  log.innerHTML = '<div class="empty">ابدأ السؤال…</div>';
}

function bubble(role, text) {
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = `row ${role}`;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text || "";
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

async function newSession() {
  const bookId = bookSel.value || null;
  const res = await fetch("/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ book_id: bookId }),
  });
  if (!res.ok) { statusEl.textContent = "تعذّر إنشاء محادثة"; return; }
  sessionId = (await res.json()).session_id;
  clearLog();
  statusEl.textContent = "جاهز";
}

async function send() {
  const message = input.value.trim();
  if (!message || !sessionId) return;
  input.value = "";
  sendBtn.disabled = true;
  bubble("user", message);
  const out = bubble("tutor", "");
  out.classList.add("cursor");
  let sourceRefs = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data:")) continue;
        const ev = JSON.parse(part.slice(5).trim());
        if (ev.delta) {
          out.textContent += ev.delta;
          log.scrollTop = log.scrollHeight;
        } else if (ev.sources) {
          const pages = [...new Set(ev.sources.map(s => s.page).filter(Boolean))].sort((a, b) => a - b);
          if (pages.length) sourceRefs = "المصادر: " + pages.map(p => "ص" + p).join("، ");
        } else if (ev.error) {
          out.textContent += `\n[خطأ: ${ev.error}]`;
        }
      }
    }
  } catch (e) {
    out.textContent += `\n[خطأ: ${e.message}]`;
  } finally {
    out.classList.remove("cursor");
    if (sourceRefs) {
      const s = document.createElement("div");
      s.className = "sources";
      s.textContent = sourceRefs;
      out.appendChild(s);
    }
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = send;
newBtn.onclick = newSession;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

loadBooks().then(newSession);
</script>
</body>
</html>
