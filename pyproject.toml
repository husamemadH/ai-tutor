[project]
name = "ai-tutor"
version = "0.1.0"
description = "Dialect-aware AI tutor grounded in textbooks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "typer>=0.12",
    "rich>=13.9",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
ai-tutor = "ai_tutor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_tutor"]

[tool.ruff]
line-length = 100
target-version = "py312"